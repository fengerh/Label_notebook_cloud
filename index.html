<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
  <title>云端标签笔记 v20260508.1020</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { background:#f4f6fa; min-height:100vh; display:flex; justify-content:center; padding:8px 6px; }
    @media(min-width:640px){ body{padding:20px;} }

    .auth-container { max-width:420px; width:100%; background:white; border-radius:26px; box-shadow:0 16px 32px rgba(0,0,0,0.04); padding:24px; margin:auto; display:flex; flex-direction:column; gap:16px; }
    .auth-container h2 { font-size:1.6rem; color:#1e293b; }
    .auth-container label { display:flex; flex-direction:column; gap:6px; font-size:0.8rem; color:#5e6f8d; }
    .auth-container input { padding:12px; border:1.5px solid #dce2ec; border-radius:18px; font-size:1rem; }
    .auth-container button { padding:12px; border-radius:40px; font-weight:600; border:none; background:#5b6cf7; color:white; cursor:pointer; font-size:1rem; }
    .password-mask { -webkit-text-security:disc; }

    .app-container { display:none; }
    .app-container.logged-in { display:flex; }
    .app-container { max-width:1400px; width:100%; background:white; border-radius:26px; box-shadow:0 16px 32px rgba(0,0,0,0.04); overflow:hidden; flex-direction:column; height:calc(100vh - 16px); min-height:600px; }
    @media(min-width:640px){ .app-container{ height:95vh; } }

    .section-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#f4f7fc; cursor:pointer; user-select:none; }
    .section-header-left { display:flex; align-items:center; gap:8px; flex:1; }
    .section-header-left .header-icon { color:#5b6cf7; font-size:1.2rem; width:1.4em; text-align:center; }
    .section-header-left .header-title { font-size:1.1rem; font-weight:600; color:#2c3e50; }
    .header-badge { background:#e6eaff; padding:2px 10px; border-radius:30px; font-size:0.8rem; color:#334155; margin-left:6px; }
    .header-toggle-btn { background:none; border:none; font-size:1.2rem; color:#5b6cf7; cursor:pointer; padding:6px; display:flex; align-items:center; }

    .app-header-wrap { border-bottom:1px solid #eef1f5; }
    .app-header-titlebar { border-bottom:1px solid #eef1f5; }
    .app-header-content { display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:8px; padding:8px 16px 8px 16px; }
    .app-header-wrap.collapsed .app-header-content { display:none; }

    #mainTitle { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:1.4rem; font-weight:600; color:#2c3e50; border:2px solid transparent; border-radius:16px; padding:4px 10px; background:transparent; outline:none; max-width:calc(100% - 40px); }
    #mainTitle:hover, #mainTitle:focus { border-color:#5b6cf7; background:white; }

    .toolbar-actions { display:flex; gap:4px; }
    .user-area { display:flex; align-items:center; gap:10px; }
    .user-email { font-size:0.85rem; color:#5b6cf7; }

    .icon-btn { background:white; border:1.5px solid #e2e8f0; border-radius:40px; padding:8px 12px; font-size:0.85rem; font-weight:500; color:#334155; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .icon-btn i { color:#5b6cf7; font-size:1rem; }
    @media(max-width:480px){ .icon-btn span{display:none;} .icon-btn{padding:8px 12px;} }

    .add-note-wrapper { background:#fafbff; border-bottom:1px solid #e9ecf2; }
    .add-note-panel { padding:0 16px 16px 16px; display:none; }
    .add-note-wrapper.expanded .add-note-panel { display:block; }
    .add-note-wrapper.expanded .fa-chevron-down { transform:rotate(180deg); }

    .add-form { display:flex; flex-direction:column; gap:12px; }
    .form-row { display:flex; flex-direction:column; gap:8px; width:100%; }

    /* 通用表单组 */
    .form-group { display:flex; flex-direction:column; gap:4px; }
    .form-group label { font-size:0.75rem; font-weight:600; text-transform:uppercase; color:#5e6f8d; white-space:nowrap; }
    .form-group input, .form-group textarea { padding:10px 12px; border:1.5px solid #dce2ec; border-radius:18px; font-size:0.95rem; background:white; width:100%; }

    /* 标题行布局 */
    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-row label {
      white-space: nowrap;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #5e6f8d;
      margin-right: 8px;
    }
    .title-row input {
      flex: 1;
    }
    .color-selector { display:flex; align-items:center; }
    .color-btn { width:36px; height:36px; border-radius:18px; border:2px solid white; box-shadow:0 2px 6px rgba(0,0,0,0.1); cursor:pointer; background:#ccc; transition:transform 0.1s; }
    .color-btn:hover { transform:scale(1.05); }
    .color-picker-dropdown { position:relative; display:inline-block; }
    .color-options { display:none; position:absolute; right:0; top:42px; background:white; border-radius:20px; box-shadow:0 8px 20px rgba(0,0,0,0.12); padding:8px; z-index:100; grid-template-columns:repeat(4,1fr); gap:6px; border:1px solid #e2e8f0; }
    .color-options.show { display:grid; }
    .color-option { width:32px; height:32px; border-radius:16px; cursor:pointer; border:2px solid transparent; transition:border 0.1s; }
    .color-option:hover { border-color:#5b6cf7; }

    /* 标签行布局 */
    .tag-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag-input-wrapper label {
      white-space: nowrap;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #5e6f8d;
      margin-right: 8px;
    }
    .tag-input-wrapper select { flex-shrink:0; padding:10px 8px; border:1.5px solid #dce2ec; border-radius:18px; font-size:0.95rem; background:white; max-width:140px; }
    .tag-input-wrapper input { flex:1; }

    /* 内容行 */
    .editor-toolbar { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
    .editor-toolbar label { font-size:0.75rem; font-weight:600; text-transform:uppercase; color:#5e6f8d; white-space:nowrap; }
    .editor-toolbar button { background:#f1f4f9; border:1px solid #dce2ec; border-radius:20px; padding:6px 14px; font-size:0.85rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }

    #noteContentEditor { min-height:120px; max-height:400px; overflow-y:auto; border:1.5px solid #dce2ec; border-radius:18px; padding:10px 12px; font-size:0.95rem; background:white; outline:none; line-height:1.6; 
      word-break: break-word;      /* 强制长单词/链接自动断行 */
      white-space: pre-wrap;       /* 保留空格与换行，同时允许自动折行 */}
    #noteContentEditor:focus { border-color:#5b6cf7; }
    #noteContentEditor:empty:before {
      content: attr(placeholder);
      color: #aaa;
      font-style: italic;
    }
    #noteContentEditor img { width:160px; height:auto; max-width:100%; border-radius:10px; margin:6px 0; cursor:default; display:block; }

    .btn { padding:10px 20px; border-radius:40px; font-weight:600; border:1.5px solid #d0d9e8; background:white; cursor:pointer; font-size:0.95rem; }
    .btn-primary { background:#5b6cf7; border-color:#5b6cf7; color:white; }
    .btn-secondary { background:white; border-color:#d0d9e8; color:#334155; }
    /* 调整表单操作栏布局 */
    .form-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end; /*靠右排列 */
    }
    /* 让插入图片按钮在最左边 */
    #insertImageBtn {
      order: -1; /* 确保它在最左边 */
      margin-right: auto; /* 将其他按钮推到右边 */
    }

    .filter-section { padding:0; border-bottom:1px solid #eef1f5; background:white; }
    .filter-controls { display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; padding:8px 16px 12px 16px; min-height:44px; }
    .filter-section.collapsed .filter-controls { display:none; }
    .tag-filters { display:flex; flex-wrap:wrap; gap:6px; }
    .tag-btn { background:#f1f4f9; border:none; padding:5px 14px; border-radius:40px; font-size:0.8rem; font-weight:500; cursor:pointer; }
    .tag-btn.active { background:#1e293b; color:white; }
    .color-filters { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .color-dot { width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform 0.1s, border-color 0.1s; }
    .color-dot:hover { transform:scale(1.2); }
    .color-dot.active { border-color:#1e293b; transform:scale(1.15); }
    .search-box { display:flex; align-items:center; margin-left:auto; gap:6px; }
    .search-box input { padding:6px 12px; border:1.5px solid #dce2ec; border-radius:20px; font-size:0.85rem; width:140px; }
    .search-box input:focus { outline:none; border-color:#5b6cf7; }
    .search-box button { padding:4px 8px; border:none; background:none; color:#7f8fa3; cursor:pointer; }

    .toc-sidebar { width:260px; background:#f4f7fc; border-right:1px solid #e9ecf2; display:flex; flex-direction:column; overflow:hidden; }
    @media(min-width:641px){ .toc-sidebar{overflow-y:auto;} }
    @media(max-width:640px){ .toc-sidebar{width:100%; border-right:none; border-bottom:1px solid #e9ecf2; max-height:40vh; transition:max-height 0.2s;} .toc-sidebar.collapsed{max-height:52px;} }
    .toc-list-container { flex:1; overflow-y:auto; padding:8px 12px 12px 12px; }
    .toc-sidebar.collapsed .toc-list-container { display:none; }
    .toc-list { list-style:none; display:flex; flex-direction:column; gap:4px; }
    .toc-item { padding:8px 10px; background:white; border-radius:14px; border:1px solid #edf1f8; cursor:pointer; display:flex; align-items:center; gap:8px; }
    .toc-tag-dot { width:10px; height:10px; border-radius:10px; background:#aaa; }
    .toc-title { font-weight:540; font-size:0.9rem; word-break:break-word; flex:1; }

    @media(max-width:640px){
    /* 标题行：同行排列 */
    .title-row {
      flex-wrap: nowrap;
    }
    /* 标签行：同行排列 */
    .tag-input-wrapper {
      flex-wrap: nowrap;
    }
    /* 内容行：内容和插入图片同行，下方是输入框 */
    .editor-toolbar {
      flex-wrap: nowrap;
    }
  }

    .main-layout { display:flex; flex:1; overflow:hidden; }
    @media(max-width:640px){ .main-layout{flex-direction:column;} }
    .notes-display { flex:1; overflow-y:auto; padding:14px 14px; background:#ffffff; scroll-behavior:smooth; }
    @media(min-width:640px){ .notes-display{padding:22px 24px;} }
    .notes-container { display:flex; flex-direction:column; gap:14px; max-width:900px; }
    .note-card { background:#ffffff; border-radius:20px; padding:16px 16px; border:1px solid #7f8fa3; scroll-margin-top:16px; }
    .note-card:nth-child(even) { background:#f1f4f9; }
    .note-card:target { border-left:5px solid #5b6cf7; background:#fcfdff !important; }
    .note-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; gap:8px; }
    .note-title { font-size:1.3rem; font-weight:650; color:#0f1a2e; }
    .note-tag { background:#eef2ff; color:#3f4d9e; padding:4px 12px; border-radius:40px; font-size:0.75rem; }
    .note-content { color:#2e405b; line-height:1.6; margin:10px 0 14px; word-wrap:break-word; white-space: pre-wrap;}
    .note-content img { max-width:100%; height:auto; border-radius:12px; margin:8px 0; }
    .note-actions { display:flex; gap:8px; justify-content:flex-end; }
    .edit-btn, .delete-btn { background:none; border:1px solid #e2e8f0; padding:5px 14px; border-radius:40px; font-size:0.8rem; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .edit-btn { color:#2c3e50; border-color:#d0d9e8; }
    .delete-btn { color:#b53b3b; border-color:#f1d7d9; }

    .img-btn-wrapper { display:inline-block; background:#f1f4f9; border-radius:12px; padding:4px 10px; margin:4px 2px; cursor:pointer; color:#5b6cf7; font-size:0.9rem; user-select:none; }
    .img-btn-wrapper i { margin-right:6px; }
    .img-btn-wrapper:hover { background:#e6eaff; }
    .img-delete-btn:hover { color:red !important; }

    .lightbox-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center; }
    .lightbox-overlay.active { display:flex; }
    .lightbox-overlay img { max-width:90%; max-height:90%; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,0.5); }

    .empty-msg { text-align:center; padding:30px; color:#7f8fa3; }
    .hidden-file-input { display:none; }
    .editing-indicator { background:#eef2ff; color:#4355e8; padding:4px 12px; border-radius:20px; font-size:0.8rem; margin-right:auto; }

    @media (max-width: 640px) {
      .search-box input { width:100px; }
      .section-header { padding: 6px 12px; }
      .section-header-left .header-title { font-size: 1rem; }
      .header-toggle-btn { font-size: 1rem; padding: 4px; }
      .filter-controls { padding: 4px 12px 8px 12px; }
      .user-email { font-size:0.75rem; }
      .icon-btn { padding:4px 8px; font-size:0.75rem; }
      .icon-btn i { font-size:0.9rem; }
      #mainTitle { font-size: 1.4rem; }
      .tag-input-wrapper select { max-width: 120px; font-size:0.85rem; }
    }

    /* 电脑端（宽度>640px）隐藏上传图片按钮 */
    @media (min-width: 641px) {
      #insertImageBtn {
        display: none !important; /* 强制隐藏，避免样式冲突 */
      }
    }

    /* 移动端（宽度≤640px）显示上传图片按钮（保持原有样式） */
    @media (max-width: 640px) {
      #insertImageBtn {
        display: inline-flex !important; /* 恢复显示 */
        order: -1; /* 确保在最左边 */
        margin-right: auto; /* 把其他按钮推到右边 */
      }
    }

    .note-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .note-time {
      display: flex;
      gap: 16px;
      color: #7f8fa3;
      font-size: 0.75rem;
    }
    .note-time i {
      margin-right: 2px;
    }
    .note-actions {
      display: flex;
      gap: 8px;
    }

    /* @media (max-width: 480px) {
      .note-footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .note-actions {
        align-self: flex-end;
      }
    } */

  </style>
</head>
<body>

<div id="authContainer" class="auth-container">
  <h2><i class="fas fa-user-circle"></i> 登录笔记</h2>
  <label><span>邮箱</span><input type="email" id="authEmail" placeholder="your@email.com" autocomplete="email" inputmode="email" autocorrect="off"></label>
  <label><span>密码（提示：密码重置需人工处理，请牢记注册密码）</span><input type="text" id="authPassword" placeholder="••••••••" autocomplete="off" inputmode="text" autocorrect="off" autocapitalize="off" class="password-mask"></label>
  <div style="display:flex; gap:8px;"><button id="signInBtn" style="flex:1;">登录</button><button id="signUpBtn" style="flex:1; background:#eef2ff; color:#5b6cf7;">注册</button></div>
  <p style="font-size:0.75rem; color:#7f8fa3; margin-top:8px;"><span id="forgotPasswordBtn" style="cursor:pointer; color:#5b6cf7;">重置密码请联系管理员</span></p>
</div>
<div id="recoveryContainer" class="auth-container" style="display:none;">
  <h2><i class="fas fa-lock"></i> 设置新密码</h2>
  <p style="font-size:0.85rem; color:#7f8fa3; margin-bottom:8px;">请输入您的新密码</p>
  <label>
    <span>新密码</span>
    <input type="password" id="recoveryPassword" placeholder="至少6位" autocomplete="new-password">
  </label>
  <label>
    <span>确认密码</span>
    <input type="password" id="recoveryPasswordConfirm" placeholder="再次输入" autocomplete="new-password">
  </label>
  <div style="display:flex; gap:8px;">
    <button id="updatePasswordBtn" style="flex:1;">重置密码</button>
    <button id="cancelRecoveryBtn" style="flex:1; background:#eef2ff; color:#5b6cf7;">取消</button>
  </div>
  <p id="recoveryMessage" style="font-size:0.75rem; color:#c0392b; display:none;"></p>
</div>

<div class="app-container" id="appContainer">
  <div class="app-header-wrap" id="appHeaderWrap">
    <div class="section-header app-header-titlebar" id="appHeaderTitlebar">
      <div class="section-header-left" style="flex:1;">
        <div class="editable-title" id="mainTitle" contenteditable="true">标签笔记</div>
        <span class="user-email" id="userEmailDisplay"></span>
      </div>
      <button class="header-toggle-btn" type="button" id="appHeaderToggleBtn"><i class="fas fa-chevron-down" id="appHeaderToggleIcon"></i></button>
    </div>
    <div class="app-header-content" id="appHeaderContent">
      <div class="toolbar-actions">
        <button class="icon-btn" id="exportJsonBtn"><i class="fas fa-file-code"></i><span>导出JSON</span></button>
        <button class="icon-btn" id="exportCsvBtn"><i class="fas fa-file-csv"></i><span>导出CSV</span></button>
        <button class="icon-btn" id="importBtn"><i class="fas fa-upload"></i><span>导入</span></button>
        <input type="file" id="importFileInput" accept=".json,.csv" class="hidden-file-input">
      </div>
      <div class="user-area"><button class="icon-btn" id="logoutBtn" title="退出登录"><i class="fas fa-sign-out-alt"></i></button></div>
    </div>
  </div>

  <!-- 添加笔记面板 -->
  <div class="add-note-wrapper" id="addNoteWrapper">
    <div class="section-header add-note-toggle" id="addNoteToggle">
      <div class="section-header-left">
        <i class="fas fa-plus-circle header-icon"></i>
        <span class="header-title toggle-text" id="toggleText">添加新笔记</span>
      </div>
      <button class="header-toggle-btn" type="button"><i class="fas fa-chevron-down"></i></button>
    </div>
    <div class="add-note-panel">
      <form class="add-form" id="addNoteForm">
        <!-- 标题行：标题 | 标题内容 | 颜色选择 -->
        <div class="form-row">
          <div class="form-group">
            <div class="title-row">
              <label>标题</label>
              <input type="text" id="noteTitleInput" placeholder="例如：项目复盘" required>
              <div class="color-selector">
                <div class="color-picker-dropdown" id="colorPickerDropdown">
                  <div class="color-btn" id="selectedColorBtn" style="background:#5b6cf7;"></div>
                  <div class="color-options" id="colorOptions"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- 标签行：标签 | 选择标签 | 标签内容 -->
        <div class="form-row">
          <div class="form-group">
            <div class="tag-input-wrapper">
              <label>标签</label>
              <select id="tagSelect"><option value="">（选择标签）</option></select>
              <input type="text" id="noteTagInput" placeholder="或输入新标签">
            </div>
          </div>
        </div>
        <!-- 内容行：内容 | 插入图片按钮 -->
        <div class="form-row">
          <div class="form-group">
             <div id="noteContentEditor" contenteditable="true" placeholder="请输入具体内容"></div>
             <!-- <input type="text" id="noteContentEditor" placeholder="请输入具体内容" required> -->
            <!-- <textarea id="noteContentEditor" placeholder="请输入具体内容"></textarea> -->
          </div>
        </div>
        <div class="form-actions">
          <button type="button" id="insertImageBtn" class="btn">插入图片</button>
          <input type="file" id="imageFileInput" accept="image/*" class="hidden-file-input">
          <span id="editingStatus" style="display:none;" class="editing-indicator"><i class="fas fa-pen"></i> 正在编辑</span>
          <button type="submit" class="btn btn-primary" id="saveNoteBtn"><i class="fas fa-check"></i> 保存</button>
          <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;">取消</button>
        </div>
        <input type="hidden" id="editingId" value="">
      </form>
    </div>
  </div>

  <div class="filter-section" id="filterSection">
    <div class="section-header filter-header" id="filterHeader">
      <div class="section-header-left"><i class="fas fa-filter header-icon"></i><span class="header-title">筛选</span></div>
      <button class="header-toggle-btn"><i class="fas fa-chevron-down" id="filterToggleIcon"></i></button>
    </div>
    <div class="filter-controls" id="filterControls">
      <div class="tag-filters" id="tagFilterContainer"></div>
      <div class="color-filters" id="colorFilterContainer"></div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索笔记..." autocomplete="off">
        <button id="clearSearchBtn" class="icon-btn" title="清除搜索"><i class="fas fa-times"></i></button>
      </div>
    </div>
  </div>

  <div class="main-layout">
    <div class="toc-sidebar" id="tocSidebar">
      <div class="section-header toc-header" id="tocHeader">
        <div class="section-header-left" id="tocToggleBtn">

    async function saveNoteToDB(title, tag, content) {
      if(!title.trim() || !content.trim()) return false;
      const noteData = { user_id: currentUser.id, title: title.trim(), content: content.trim(), tag: tag.trim() || '未分类', color: currentSelectedColor,          // 保存笔记自身的颜色
      updated_at: new Date().toISOString() };
      if(editingId) {
        const oldNote = notes.find(n => n.id === editingId);
        if(oldNote) {
          const oldPaths = extractImagePaths(oldNote.content);
          const newPaths = extractImagePaths(noteData.content);
          const toRemove = oldPaths.filter(p => !newPaths.includes(p));
          if(toRemove.length) {
            const { error: delError } = await supabaseClient.storage.from('notes-images').remove(toRemove);
            if(delError) console.warn('清理旧图片失败:', delError);
          }
        }
        const { error } = await supabaseClient.from('notes').update(noteData).eq('id', editingId);
        if(error){ alert('更新失败'); return false; }
      } else {
        const { error } = await supabaseClient.from('notes').insert(noteData);
        if(error){ alert('创建失败'); return false; }
      }
      //await syncTagColor(formatTag(noteData.tag), currentSelectedColor); // 不再同步标签颜色
      return true;
    }

    function extractImagePaths(content) {
      const paths = [];
      const btnRegex = /<span[^>]+class="[^"]*img-btn-wrapper[^"]*"[^>]+data-img-src="(https:\/\/[^\/]+\/storage\/v1\/object\/public\/notes-images\/([^"]+))"/g;
      let match;
      while((match = btnRegex.exec(content)) !== null) paths.push(match[2]);
      const imgRegex = /<img[^>]+src="(https:\/\/[^\/]+\/storage\/v1\/object\/public\/notes-images\/([^"]+))"/g;
      while((match = imgRegex.exec(content)) !== null) {
        if(!paths.includes(match[2])) paths.push(match[2]);
      }
      return paths;
    }

    async function deleteNoteWithImages(id) {
      const note = notes.find(n => n.id === id);
      if(!note) return;
      const imagePaths = extractImagePaths(note.content);
      const { error } = await supabaseClient.from('notes').delete().eq('id', id);
      if(error){ alert('删除笔记失败'); return; }
      if(imagePaths.length) {

        if(storageError) console.warn('图片删除部分失败:', storageError);

    // 图片上传
    async function compressImage(file, maxW=800, quality=0.5) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if(w > maxW){ h *= maxW/w; w = maxW; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
        };
        img.src = URL.createObjectURL(file);
      });
    }

    async function uploadImage(blob) {
      const fileName = `${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
      const { error } = await supabaseClient.storage.from('notes-images').upload(fileName, blob, { contentType:'image/jpeg', upsert:false });
      if(error) throw error;
      const { data } = supabaseClient.storage.from('notes-images').getPublicUrl(fileName);
      return data.publicUrl;
    }

    function formatTag(t) { return (!t || t.trim()==='') ? '未分类' : t.trim(); }
    function getAllTags() { return [...new Set(notes.map(n => formatTag(n.tag)))]; }
    function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str||''; return div.innerHTML; }
    function getFilteredNotes() {
      let result = notes.slice();
      if(currentTag !== '全部') result = result.filter(n => formatTag(n.tag) === currentTag);

      // 颜色筛选：直接看笔记的 color 字段
      if(currentColor !== '全部') {
        result = result.filter(n => n.color === currentColor);
      }

      if(searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        result = result.filter(n => {
          const title = (n.title||'').toLowerCase();
          const tag = formatTag(n.tag).toLowerCase();
          const plainContent = (n.content||'').replace(/<[^>]*>/g,'').toLowerCase();
          return title.includes(q) || tag.includes(q) || plainContent.includes(q);
        });
      }
      return result;
    }

    function contentWithImageButtons(htmlContent, showDelete = false) {
      if(!htmlContent) return '';
      return htmlContent.replace(/<img[^>]+src="([^"]+)"[^>]*>/g, (match, src) => {

        return `<span class="img-btn-wrapper" data-img-src="${src}" contenteditable="false"><i class="far fa-image"></i> 查看图片${delIcon}</span>`;
      });
    }

      tagFilterContainer.innerHTML = html;

      // 颜色点基于笔记自身的颜色字段
      const usedColors = [...new Set(notes.map(n => n.color || DEFAULT_TAG_COLOR))];
      let colorDotsHtml = `<span class="color-dot ${currentColor==='全部'?'active':''}" data-color="全部" style="background:conic-gradient(#ccc 0deg 360deg); border:2px solid #aaa;" title="全部颜色"></span>`;

    function renderTOC() {

    function renderNotes() {
      const filtered = getFilteredNotes();
      if(!filtered.length) { notesContainer.innerHTML = '<div class="empty-msg"><i class="far fa-clipboard"></i><p>点击添加笔记</p></div>'; return; }
      let cards = '';

        const processedContent = contentWithImageButtons(n.content, false);
        // 格式化时间
        const created = new Date(n.created_at).toLocaleString('zh-CN', {
          month: 'numeric', day: 'numeric',

        const updated = new Date(n.updated_at).toLocaleString('zh-CN', {
          month: 'numeric', day: 'numeric',
          hour: '2-digit', minute: '2-digit'

    function exportJson() {

    }
    function exportCsv() {
      let csv = "标题,标签,内容\n";
      notes.forEach(n => {
        const plain = (n.content||'').replace(/<[^>]*>/g,'').replace(/"/g,'""').replace(/\n/g,' ');
        csv += `"${n.title.replace(/"/g,'""')}","${formatTag(n.tag).replace(/"/g,'""')}","${plain}"\n`;
      });
      const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `notes_${new Date().toISOString().slice(0,10)}.csv`; a.click();
    }
    function parseCSVLine(line) {
      const r=[]; let cur='', inQ=false;
      for(let i=0;i<line.length;i++){
        const ch=line[i];
        if(ch==='"'&&!inQ) inQ=true;
        else if(ch==='"'&&inQ){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
        else if(ch===','&&!inQ){ r.push(cur); cur=''; }
        else cur+=ch;
      }
      r.push(cur); return r;
    }
    async function processImported(importedNotes, importedColors=null) {
      if(!currentUser) return;
      const valid = importedNotes.filter(i => i.title && i.content);
      if(!valid.length){ alert('无有效笔记'); return; }
      if(!confirm(`导入 ${valid.length} 条。确定合并，取消替换全部。`)){
        await supabaseClient.from('notes').delete().eq('user_id',currentUser.id);
      }
      for(const item of valid){
        await supabaseClient.from('notes').insert({ user_id:currentUser.id, title:item.title, content:item.content, tag:item.tag||'未分类' });
      }
      if(importedColors) {
        for(const [tag,color] of Object.entries(importedColors)) await syncTagColor(tag,color);
      }
      await loadNotes(); currentTag='全部'; resetFormState();
    }
    async function importFile(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      const reader = new FileReader();
      reader.onload = async(e) => {
        try {
          if(ext==='json'){
            const json = JSON.parse(e.target.result);
            let importedNotes = Array.isArray(json) ? json : json.notes;
            let importedColors = json.tagColorMap || null;
            if(!Array.isArray(importedNotes)) throw new Error('非数组');
            await processImported(importedNotes, importedColors);
          } else {
            const lines = e.target.result.split(/\r?\n/).filter(l => l.trim());
            if(lines.length<2){ alert('CSV无数据'); return; }
            const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g,'').trim());
            const ti = headers.findIndex(h => h.includes('标题')||h==='title');
            const gi = headers.findIndex(h => h.includes('标签')||h==='tag');
            const ci = headers.findIndex(h => h.includes('内容')||h==='content');
            if(ti===-1||ci===-1){ alert('CSV需包含标题和内容列'); return; }
            const imported = [];
            for(let i=1;i<lines.length;i++){
              const row = parseCSVLine(lines[i]);
              if(row.length <= Math.max(ti,ci)) continue;
              const title = (row[ti]||'').replace(/^"|"$/g,'').trim();
              const content = (row[ci]||'').replace(/^"|"$/g,'').trim();
              if(!title||!content) continue;
              const tag = gi>=0 ? (row[gi]||'').replace(/^"|"$/g,'').trim() : '未分类';
              imported.push({ title, content, tag:tag||'未分类' });
            }
            await processImported(imported);
          }
        } catch(err){ alert('解析失败: '+err.message); }
        importFileInput.value = '';
      };
      reader.readAsText(file,'UTF-8');
    }

    
    // 折叠控制：整个标题条都能折叠“添加笔记”
    addToggle.addEventListener('click', (e) => {
      // 如果点击的是内容区域，不折叠
      if (e.target.closest('.add-note-panel')) return;
      
      e.stopPropagation();
      addWrapper.classList.toggle('expanded');
      // 如果面板被折叠了，重置表单
      if (!addWrapper.classList.contains('expanded')) {
        resetFormState();
      }
    });

    // 箭头按钮单独处理（可选，如果你想要特殊效果）
    const addNoteToggleBtn = addToggle.querySelector('.header-toggle-btn');
    addNoteToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      // 这里可以添加箭头旋转动画等
      addWrapper.classList.toggle('expanded');
      if (!addWrapper.classList.contains('expanded')) {
        resetFormState();
      }
    });

    // 重置密码
    updatePasswordBtn.addEventListener('click', async () => {
      const newPassword = recoveryPassword.value;
      const confirmPassword = recoveryPasswordConfirm.value;

      if (!newPassword || newPassword.length < 6) {
        recoveryMessage.textContent = '密码至少6位';
        recoveryMessage.style.display = 'block';
        return;
      }
      if (newPassword !== confirmPassword) {
        recoveryMessage.textContent = '两次密码不一致';
        recoveryMessage.style.display = 'block';
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
      if (error) {
        recoveryMessage.textContent = '重置失败: ' + error.message;
        recoveryMessage.style.display = 'block';
      } else {
        alert('密码已重置，请使用新密码登录');
        // 清除 hash 并刷新到正常状态
        window.location.hash = '';
        recoveryContainer.style.display = 'none';
        authContainer.style.display = 'flex';
        recoveryPassword.value = '';
        recoveryPasswordConfirm.value = '';
        await supabaseClient.auth.signOut();  // 强制退出，让用户用新密码重新登录
      }
    });

    // 取消重置
    cancelRecoveryBtn.addEventListener('click', () => {
      window.location.hash = '';
      recoveryContainer.style.display = 'none';
      authContainer.style.display = 'flex';
      recoveryPassword.value = '';
      recoveryPasswordConfirm.value = '';
    });

    // 在原有JS中添加（放在addNoteToggleBtn事件绑定之后）
    const addNotePanel = document.querySelector('.add-note-panel');
    addNotePanel.addEventListener('click', e => e.stopPropagation());

    appHeaderToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      appHeaderWrap.classList.toggle('collapsed');
      const isCollapsed = appHeaderWrap.classList.contains('collapsed');
      appHeaderToggleIcon.className = isCollapsed ? 'fas fa-chevron-down' : 'fas fa-chevron-up';
    });

    function toggleToc() {
      tocSidebar.classList.toggle('collapsed');
      tocToggleIcon.className = tocSidebar.classList.contains('collapsed') ? 'fas fa-chevron-down' : 'fas fa-chevron-up';
    }
    tocHeader.addEventListener('click', toggleToc);

    function toggleFilter() {
      filterSection.classList.toggle('collapsed');
      const isCollapsed = filterSection.classList.contains('collapsed');
      filterToggleIcon.className = isCollapsed ? 'fas fa-chevron-down' : 'fas fa-chevron-up';
    }
    filterHeader.addEventListener('click', toggleFilter);

    function autoToggleToc() {
      const isMobile = window.innerWidth <= 640;
      if(isMobile) {
        tocSidebar.classList.add('collapsed');
        tocToggleIcon.className = 'fas fa-chevron-down';
      } else {
        tocSidebar.classList.remove('collapsed');
        tocToggleIcon.className = 'fas fa-chevron-up';
      }
    }
    function autoToggleFilter() {
      const isMobile = window.innerWidth <= 640;
      if(isMobile) {
        filterSection.classList.add('collapsed');
        filterToggleIcon.className = 'fas fa-chevron-down';
      } else {
        filterSection.classList.add('collapsed');
        filterToggleIcon.className = 'fas fa-chevron-down';
      }
    }
    function autoToggleAppHeader() {
      const isMobile = window.innerWidth <= 640;
      if(isMobile) {
        appHeaderWrap.classList.add('collapsed');
        appHeaderToggleIcon.className = 'fas fa-chevron-down';
      } else {
        appHeaderWrap.classList.add('collapsed');
        appHeaderToggleIcon.className = 'fas fa-chevron-down';
      }
    }
    
    function autoToggleAddNote() {
    // 只在电脑端（宽度>640px）自动折叠
    if (window.innerWidth > 640) {
      addWrapper.classList.remove('expanded');
    }
    // 手机端（宽度≤640px）不自动折叠！
  }
    
    // function autoToggleAddNote() {
    //   addWrapper.classList.remove('expanded');
    // }

    // 事件绑定
    mainTitleEl.addEventListener('blur', saveAppTitle);
    mainTitleEl.addEventListener('click', (e) => { e.stopPropagation(); });
    mainTitleEl.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); mainTitleEl.blur(); } });

    addForm.addEventListener('submit', handleFormSubmit);
    cancelEditBtn.addEventListener('click', () => { resetFormState(); addWrapper.classList.remove('expanded'); });

    tagFilterContainer.addEventListener('click', e => {
      const btn = e.target.closest('.tag-btn');
      if(btn){ currentTag = btn.dataset.tag; renderAll(); }
    });
    colorFilterContainer.addEventListener('click', e => {
      const dot = e.target.closest('.color-dot');
      if(!dot) return;
      currentColor = dot.dataset.color;
      renderFilters(); renderTOC(); renderNotes();
    });
    searchInput.addEventListener('input', () => { searchQuery = searchInput.value; renderTOC(); renderNotes(); });
    clearSearchBtn.addEventListener('click', () => { searchInput.value=''; searchQuery=''; renderTOC(); renderNotes(); });

    tocContainer.addEventListener('click', e => {
      const item = e.target.closest('.toc-item'); if(!item) return;
      const id = item.dataset.noteId;
      const card = document.getElementById(`note-${id}`);
      if(card){
        card.scrollIntoView({ behavior:'smooth', block:'start' });
        card.style.backgroundColor = '#f4f7ff';
        setTimeout(() => card.style.backgroundColor = '', 500);
      } else {
        const exists = notes.find(n => n.id === id);
        if(exists){ currentTag='全部'; renderAll(); setTimeout(() => document.getElementById(`note-${id}`)?.scrollIntoView({ behavior:'smooth' }),60); }
      }
      if(window.innerWidth <= 640 && !tocSidebar.classList.contains('collapsed')) toggleToc();
    });

    notesContainer.addEventListener('click', e => {
      const editBtn = e.target.closest('.edit-btn'), delBtn = e.target.closest('.delete-btn');
      if(editBtn) startEditNote(editBtn.dataset.editId);
      else if(delBtn) handleDelete(delBtn.dataset.deleteId);
      const imgBtn = e.target.closest('.img-btn-wrapper');
      if(imgBtn && !e.target.classList.contains('img-delete-btn')) {
        const src = imgBtn.dataset.imgSrc; if(src) showLightbox(src);
      }
    });

    contentEditor.addEventListener('click', (e) => {
      if(e.target.classList.contains('img-delete-btn')) {
        if(confirm('确定要删除这张图片吗？')) {
          const wrapper = e.target.closest('.img-btn-wrapper');
          if(wrapper) wrapper.remove();
        }
        e.preventDefault();
      } else {
        const btn = e.target.closest('.img-btn-wrapper');
        if(btn) { const src = btn.dataset.imgSrc; if(src) showLightbox(src); }
      }
    });

    exportJsonBtn.addEventListener('click', exportJson);
    exportCsvBtn.addEventListener('click', exportCsv);
    importBtn.addEventListener('click', () => importFileInput.click());
    importFileInput.addEventListener('change', e => { if(importFileInput.files[0]) importFile(importFileInput.files[0]); });

    // 初始化
    initColorPicker();
    window.addEventListener('DOMContentLoaded', () => {
      // 如果URL中有 recovery，优先显示重置界面（不需要等待认证状态）
      if (window.location.hash.includes('type=recovery')) {
        authContainer.style.display = 'none';
        recoveryContainer.style.display = 'flex';
        appContainer.classList.remove('logged-in');
        // 仍然继续执行后续的认证状态检查，但 recovery 会覆盖显示
        } else {
        autoToggleToc();
        autoToggleFilter();
        autoToggleAppHeader();
        autoToggleAddNote();
        refreshAuthUI();
        }
    });
    window.addEventListener('resize', () => {
      autoToggleToc();
      autoToggleFilter();
      autoToggleAppHeader();
      autoToggleAddNote();
    });

    // 防止手机端点击新笔记内容区域时触发折叠
    document.querySelector('.add-note-panel').addEventListener('click', function(e) {
      e.stopPropagation();
    });

  })();
</script>
